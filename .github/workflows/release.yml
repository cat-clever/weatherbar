name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v），例如 1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION"

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-xcodegen-${{ hashFiles('project.yml') }}
          restore-keys: brew-${{ runner.os }}-

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build
        env:
          MARKETING_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -o pipefail
          xcodebuild \
            -project WeatherBar.xcodeproj \
            -scheme WeatherBar \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | xcbeautify --renderer github-actions

      - name: Verify universal binary
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/WeatherBar.app"
          BIN="$APP/Contents/MacOS/WeatherBar"
          test -d "$APP"
          lipo -info "$BIN"
          for arch in arm64 x86_64; do
            lipo -info "$BIN" | grep -q "$arch" || { echo "::error::missing $arch slice"; exit 1; }
          done

      - name: Package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          APP="build/Build/Products/Release/WeatherBar.app"
          mkdir -p dist
          cp -R "$APP" dist/
          codesign --force --sign - --entitlements WeatherBar/WeatherBar.entitlements "dist/WeatherBar.app"
          codesign --verify --deep --strict --verbose=2 "dist/WeatherBar.app"
          (cd dist && ditto -c -k --keepParent WeatherBar.app "WeatherBar-${VERSION}.zip")

          # Sparkle signatures allow installed apps to verify and install updates silently.
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "::error::SPARKLE_PRIVATE_KEY secret is required"; exit 1; }
          SIGN_UPDATE="$(find build/SourcePackages/artifacts -name sign_update -type f -print -quit)"
          test -x "$SIGN_UPDATE" || { echo "::error::Sparkle sign_update tool not found"; exit 1; }
          ARCHIVE="dist/WeatherBar-${VERSION}.zip"
          SIGNATURE="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - -p "$ARCHIVE")"
          LENGTH="$(stat -f%z "$ARCHIVE")"
          PUB_DATE="$(date -u '+%a, %d %b %Y %H:%M:%S %z')"
          cat > dist/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>WeatherBar</title>
              <link>https://github.com/cat-clever/weatherbar/releases</link>
              <description>WeatherBar software updates</description>
              <language>zh-cn</language>
              <item>
                <title>WeatherBar ${VERSION}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <enclosure url="https://github.com/cat-clever/weatherbar/releases/download/v${VERSION}/WeatherBar-${VERSION}.zip" sparkle:version="${GITHUB_RUN_NUMBER}" sparkle:shortVersionString="${VERSION}" sparkle:edSignature="${SIGNATURE}" length="${LENGTH}" type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          EOF

          # dmg：App + Applications 快捷方式（拖拽即安装）
          STAGING=$(mktemp -d)
          cp -R "dist/WeatherBar.app" "$STAGING/WeatherBar.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "WeatherBar ${VERSION}" \
            -srcfolder "$STAGING" -ov -format UDZO \
            "dist/WeatherBar-${VERSION}.dmg"
          rm -rf "$STAGING"

          (cd dist && shasum -a 256 WeatherBar-* > SHA256SUMS.txt)
          ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.ver.outputs.version) || github.ref_name }}
          name: WeatherBar ${{ steps.ver.outputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            dist/WeatherBar-${{ steps.ver.outputs.version }}.dmg
            dist/WeatherBar-${{ steps.ver.outputs.version }}.zip
            dist/SHA256SUMS.txt
            dist/appcast.xml
